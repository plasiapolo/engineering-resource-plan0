services:
  - type: web
    name: engineering-resource-planner
    runtime: node
    plan: free
    region: frankfurt
    rootDir: .
    buildCommand: npm ci && npm run build
    startCommand: NODE_ENV=production npx prisma migrate deploy --schema apps/server/prisma/schema.prisma && NODE_ENV=production npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: COOKIE_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: ""
      - key: DATABASE_URL
        fromDatabase:
          name: erp-db
          property: connectionString

databases:
  - name: erp-db
    plan: free
    region: frankfurt
    databaseName: erp
    user: erp